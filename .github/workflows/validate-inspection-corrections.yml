name: Validate inspection corrections
on:
  push:
    branches: [fix/section-edit-save-stability]
    paths:
      - ".github/workflows/validate-inspection-corrections.yml"
      - "src/GeoAutoDocs.Core/InspectionCorrections.cs"
      - "tests/GeoAutoDocs.Tests/InspectionCorrectionTests.cs"
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build GeoAutoDocs.sln --configuration Release
      - run: dotnet test tests/GeoAutoDocs.Tests/GeoAutoDocs.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~InspectionCorrectionTests
