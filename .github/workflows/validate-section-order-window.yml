name: Validate stable section ordering dialog

on:
  push:
    branches:
      - fix/section-edit-save-stability
  pull_request:
  workflow_dispatch:

jobs:
  build-start-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GeoAutoDocs.sln
      - name: Build Release
        run: dotnet build GeoAutoDocs.sln --configuration Release --no-restore
      - name: Smoke test WPF startup
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "GeoAutoDocs-order-window"
          $env:GEOAUTODOCS_DATA_ROOT = $testRoot
          $executable = Resolve-Path "src/GeoAutoDocs.App/bin/Release/net8.0-windows/GeoAutoDocs.App.exe"
          $process = Start-Process $executable -PassThru
          try {
            $logPath = Join-Path $testRoot "logs/GeoAutoDocs.log"
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            $started = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path $logPath) {
                $log = Get-Content $logPath -Raw
                if ($log -match "Janela principal exibida") {
                  $started = $true
                  break
                }
                if ($log -match "Falha ao inicializar banco de dados") {
                  throw "Falha de inicialização.`n$log"
                }
              }
              if ($process.HasExited) {
                throw "O aplicativo encerrou antes de exibir a janela. ExitCode=$($process.ExitCode)"
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $started) { throw "A janela principal não foi exibida dentro do prazo." }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Test all
        run: dotnet test GeoAutoDocs.sln --configuration Release --no-build --verbosity normal
