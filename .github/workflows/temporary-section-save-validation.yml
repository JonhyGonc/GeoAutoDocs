name: Temporary section save validation

on:
  push:
    branches:
      - fix/section-edit-save-stability
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GeoAutoDocs.sln
      - run: dotnet build GeoAutoDocs.sln --configuration Release --no-restore
      - run: dotnet test tests/GeoAutoDocs.Tests/GeoAutoDocs.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GeoAutoDocs.Tests.ProjectStoreTests"
