name: Temporary correction validation

on:
  push:
    branches:
      - fix/section-edit-save-stability

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GeoAutoDocs.sln

      - name: Build Release
        run: dotnet build GeoAutoDocs.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GeoAutoDocs.sln --configuration Release --no-build --no-restore
